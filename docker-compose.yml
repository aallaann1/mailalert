services:
  frontend:
    image: ghcr.io/aallaann1/mailalert-frontend:latest
    container_name: mailalert-frontend
    restart: always
    ports:
      - 3000:3000
    env_file:
      - .env
    depends_on:
      - backend

  backend:
    image: ghcr.io/aallaann1/mailalert-backend:latest
    container_name: mailalert-backend
    restart: always
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
